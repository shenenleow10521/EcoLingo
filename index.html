<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="EcoLingo: learn the UN Sustainable Development Goals in two-minute lessons, quick quizzes and weekly eco-actions.">
<title>EcoLingo</title>
<meta name="theme-color" content="#1C8549">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EcoLingo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a phone-width app shell (header, scrolling view, 5-tab bar). On desktop it sits in a framed device beside a short project note, over a faint contour-map ground. */
:root{
  --bg:#EEF4EE; --stage:#E3ECE2; --topo:#D3E0D2; --surface:#FCFEFB; --surface-2:#E3EBE2;
  --line:#D2DDD0; --line-strong:#A8BBA8;
  --ink:#13261B; --muted:#55695B;
  --accent:#1C8549; --accent-deep:#11653A; --accent-ink:#FFFFFF; --accent-soft:#D2ECDA;
  --sun:#D58A00; --sun-soft:#FBECC8; --ember:#E0531F;
  --good:#1C8549; --good-soft:#D2ECDA; --bad:#C2352F; --bad-soft:#F8DCDA;
  --hero:#163B27; --hero-ink:#EAF5EC; --hero-muted:#A6C5AF; --hero-track:#2A5640;
  --soil:#D7CDBB; --stem:#2E7D4A; --on-sdg:#FFFFFF; --medal-ink:#21190A;
  --gold:#E5AC2A; --silver:#B7C3C0; --bronze:#C98A55;
  --scrim:rgba(8,22,14,.5);
  --shadow:0 1px 2px rgba(19,38,27,.05),0 6px 16px rgba(19,38,27,.06);
  --shadow-lg:0 30px 80px rgba(19,38,27,.2);
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1510; --stage:#08100B; --topo:#13221A; --surface:#14211A; --surface-2:#1C2D23;
    --line:#25382C; --line-strong:#40594A; --ink:#E5F0E7; --muted:#93AA9A;
    --accent:#3FBF73; --accent-deep:#21834A; --accent-ink:#062010; --accent-soft:#183A26;
    --sun:#F4BA45; --sun-soft:#3A2D10; --ember:#FF7A45;
    --good:#3FBF73; --good-soft:#183A26; --bad:#F2716B; --bad-soft:#3F1B1A;
    --hero:#173826; --hero-ink:#E8F5EC; --hero-muted:#9CC2A8; --hero-track:#264C36;
    --soil:#2E2B21; --stem:#4FB777; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25); --shadow-lg:0 30px 80px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1510; --stage:#08100B; --topo:#13221A; --surface:#14211A; --surface-2:#1C2D23;
  --line:#25382C; --line-strong:#40594A; --ink:#E5F0E7; --muted:#93AA9A;
  --accent:#3FBF73; --accent-deep:#21834A; --accent-ink:#062010; --accent-soft:#183A26;
  --sun:#F4BA45; --sun-soft:#3A2D10; --ember:#FF7A45;
  --good:#3FBF73; --good-soft:#183A26; --bad:#F2716B; --bad-soft:#3F1B1A;
  --hero:#173826; --hero-ink:#E8F5EC; --hero-muted:#9CC2A8; --hero-track:#264C36;
  --soil:#2E2B21; --stem:#4FB777; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25); --shadow-lg:0 30px 80px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

html{height:100%}
body{height:100%;margin:0;background:var(--stage);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch}
.app{position:relative;display:flex;flex-direction:column;width:100%;max-width:560px;height:100%;background:var(--bg);overflow:hidden;isolation:isolate}
.about{display:none}
@media (min-width:560px) and (max-width:959px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (min-width:960px){
  body{background-image:repeating-radial-gradient(ellipse 120% 90% at 12% 88%,transparent 0 30px,var(--topo) 30px 31.5px)}
  .stage{align-items:center;gap:64px;padding-block:24px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .app{width:410px;flex:none;height:min(880px,100%);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow-lg)}
  .about{display:flex}
}

.topbar{flex:none;display:flex;align-items:center;gap:8px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font:800 21px/1 var(--f-display);letter-spacing:-.03em}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);transform:rotate(-6deg)}
.mark .i{width:19px;height:19px}
.pill{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill .i{width:17px;height:17px}
.pill.pts .i{color:var(--sun)} .pill.streak .i{color:var(--ember)}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:800 13px var(--f-display);border:1px solid var(--line)}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-block:4px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(48px);opacity:.3}}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-block:6px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding-block:3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.01em}
.tab .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .pip{display:grid;place-items:center;width:48px;height:30px;border-radius:15px;transition:background .25s}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .pip{background:var(--accent-soft)}
.tab[aria-selected="true"] .i{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:scale(.7) translateY(3px)}}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 28px/1.08 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.h2{font:750 19px/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.muted{color:var(--muted)} .smt{font-size:13px}
.head{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--accent-deep);transition:transform .12s,box-shadow .12s,background .2s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 3px 0 var(--line-strong)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line-strong)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn .i{width:18px;height:18px}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:12px;background:var(--surface-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip .i{width:14px;height:14px}
.chip.next{background:var(--accent);color:var(--accent-ink)}
.chip.sun{background:var(--sun-soft);color:var(--ink)}
.chip.sun .i{color:var(--sun)}
.chip.good{background:var(--good-soft);color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}

/* SDG tile: the UN goal square, number-first */
.sdg-tile{position:relative;display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:14px;background:var(--unit);color:var(--on-sdg)}
.sdg-tile small{position:absolute;top:6px;left:7px;font-size:8.5px;font-weight:700;letter-spacing:.08em;opacity:.92}
.sdg-tile b{font:800 28px/1 var(--f-display);margin-top:9px;letter-spacing:-.02em}
.sdg-tile.sm{width:44px;height:44px;border-radius:11px}
.sdg-tile.sm small{font-size:7px;top:4px;left:5px}
.sdg-tile.sm b{font-size:19px;margin-top:7px}

/* ---------- learn ---------- */
.grow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px 12px 6px;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 72%)}
.plant{width:118px;height:auto;display:block;overflow:visible}
.stem{stroke-dasharray:1;stroke-dashoffset:0}
.stem.draw{animation:draw 1.1s ease-out}
@keyframes draw{from{stroke-dashoffset:1}}
.leaf{transform-box:fill-box;transform-origin:0% 60%}
.leaf.on{fill:var(--c)}
.leaf.off{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:3 3}
.leaf.pop{animation:leafpop .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
@keyframes leafpop{from{transform:scale(0) rotate(-25deg)}}
.vein{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.2;stroke-linecap:round}
.bloom{transform-box:fill-box;transform-origin:center;animation:leafpop 1s cubic-bezier(.3,1.6,.5,1) both}
.grow-text{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.grow-big{font:800 30px/1 var(--f-display);letter-spacing:-.03em}
.grow-big span{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.grow-text .muted{font-size:13px}

.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:transform .15s,border-color .2s}
.unit:hover{border-color:var(--line-strong)}
.unit:active{transform:scale(.985)}
.unit.is-next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.unit-title{font:750 17px/1.2 var(--f-display);letter-spacing:-.01em}
.unit-sub{font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
.status .i{width:14px;height:14px}
.status.done{color:var(--good)}
.unit-end{color:var(--muted)}
.ok-dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--good);color:var(--accent-ink)}
.ok-dot .i{width:16px;height:16px;stroke-width:2.6}

/* ---------- quiz ---------- */
.mix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px;border-radius:24px;background:var(--hero);color:var(--hero-ink);overflow:hidden;position:relative}
.mix .eyebrow{color:var(--hero-muted)}
.mix h2{font:800 23px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:4px}
.mix p{font-size:13.5px;color:var(--hero-muted);margin-top:6px}
.mix .btn{margin-top:14px}
.mix-art{display:grid;grid-template-columns:repeat(2,30px);gap:6px;transform:rotate(8deg)}
.mix-art span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--f-display);color:var(--on-sdg)}
.mix-art span:nth-child(2){transform:translateY(10px)} .mix-art span:nth-child(4){transform:translateY(10px)}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px 10px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .15s}
.qrow:hover{border-color:var(--line-strong)} .qrow:active{transform:scale(.985)}
.qrow .t{font:750 16px/1.2 var(--f-display)}
.qrow .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.best{display:flex;gap:3px;margin-top:6px}
.best i{width:14px;height:5px;border-radius:3px;background:var(--surface-2)}
.best i.on{background:var(--unit)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rule{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.rule b{font:800 18px var(--f-display);color:var(--sun);font-variant-numeric:tabular-nums}
.rule span{font-size:12px;color:var(--muted);line-height:1.3}

.q-top{display:flex;align-items:center;gap:12px;padding-top:4px}
.segs{flex:1;display:flex;gap:5px}
.segs span{flex:1;height:8px;border-radius:4px;background:var(--surface-2);transition:background .3s}
.segs .ok{background:var(--good)} .segs .no{background:var(--bad)} .segs .cur{background:var(--line-strong)} .segs .on{background:var(--unit)}
.q-count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.q-card{display:flex;flex-direction:column;gap:12px;padding-block:8px 4px}
.unit-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.unit-chip span{display:grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:7px;background:var(--unit);color:var(--on-sdg);font:800 11px var(--f-display)}
.q-text{font:750 23px/1.22 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px 11px 11px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;transition:border-color .2s,background .2s,opacity .25s}
.opt .k{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--surface-2);font:800 15px var(--f-display);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt .mk{opacity:0} .opt .mk .i{width:20px;height:20px;stroke-width:2.6}
.opt.correct{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.correct .k{background:var(--good);color:var(--accent-ink)}
.opt.correct .mk{opacity:1;color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt.wrong .mk{opacity:1;color:var(--bad)}
.opt.dim{opacity:.5}
.pulse{animation:pulse .5s ease-out} .shake{animation:shake .45s ease-in-out}
@keyframes pulse{40%{transform:scale(1.035)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.fb-h{display:flex;align-items:center;gap:8px;font:800 18px var(--f-display)}
.feedback.ok .fb-h{color:var(--good)} .feedback.no .fb-h{color:var(--bad)}
.feedback p{font-size:14.5px}
.feedback .btn{margin-top:6px}

.result{align-items:center;text-align:center;padding-top:10px}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--surface-2);stroke-width:12}
.ring .val{fill:none;stroke:var(--unit);stroke-width:12;stroke-linecap:round;animation:ringfill 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes ringfill{from{stroke-dasharray:0 100}}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font:800 52px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-c span{font-size:13px;color:var(--muted);font-weight:700}
.result .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.result .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:6px}
.recap{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.recap li{list-style:none;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.recap li .i{width:18px;height:18px;stroke-width:2.6}
.recap .y .i{color:var(--good)} .recap .n .i{color:var(--bad)}
.recap ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

/* ---------- badges ---------- */
.level{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:24px;background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.level .eyebrow{color:var(--hero-muted)}
.lv-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lv-big{font:800 54px/.9 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.lv-big span{font-size:16px;letter-spacing:0;font-weight:700;color:var(--hero-muted);margin-left:4px}
.lv-name{text-align:right}
.lv-name b{display:block;font:800 22px/1.1 var(--f-display)}
.lv-name small{font-size:12.5px;color:var(--hero-muted)}
.bar{height:10px;border-radius:5px;background:var(--hero-track);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--sun);animation:fillw 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes fillw{from{width:0}}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;position:relative}
.ladder::before{content:"";position:absolute;left:10%;right:10%;top:6px;height:2px;background:var(--hero-track)}
.rung{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--hero-muted);font-weight:700}
.rung .n{width:14px;height:14px;border-radius:50%;border:2px solid var(--hero-muted);background:var(--hero)}
.rung.on .n{background:var(--sun);border-color:var(--sun)}
.rung.cur{color:var(--hero-ink)}
.rung.cur .n{box-shadow:0 0 0 4px var(--hero-track)}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- challenges ---------- */

@keyframes stamp{0%{opacity:0;transform:scale(1.9) rotate(-22deg)}30%{opacity:1;transform:scale(1) rotate(-12deg)}75%{opacity:1;transform:scale(1) rotate(-12deg)}100%{opacity:0;transform:scale(.9) rotate(-12deg)}}

/* ---------- leaderboard ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--surface-2)}

.grabber{width:40px;height:5px;border-radius:3px;background:var(--line-strong);align-self:center;margin-bottom:6px}

.acct .msg.err{color:var(--bad)}
.pod.empty{opacity:.45}
.mbar{display:block;height:6px;margin-top:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--unit,var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.combo{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--sun-soft);color:var(--ink);font-weight:800;font-size:12.5px;animation:mpop .45s cubic-bezier(.3,1.5,.5,1)}

.setrow > div{flex:1;min-width:0}

.setrow span{display:block;font-size:12.5px;color:var(--muted)}

function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return dkey(d); }
function weekDays(){ var d=new Date(); d.setHours(0,0,0,0); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); var out=[]; for(var i=0;i<7;i++){ var x=new Date(d); x.setDate(d.getDate()+i); out.push(x); } return out; }
function fmtDay(d){ return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }

/* ---------- state ---------- */
var KEY = "ecolingo-proto-v1";
function zeroState(nick){ return { v:1, nick:nick||"EcoRookie", lessons:{}, quiz:{}, checkins:[], log:[], streak:0, last:"", badges:{}, qa:{}, perfect:{}, mixDay:"", onb:false }; }
function norm(s){ if(!s) return s; s.qa=s.qa||{}; s.perfect=s.perfect||{}; s.mixDay=s.mixDay||""; s.onb=!!s.onb; s.lessons=s.lessons||{}; s.quiz=s.quiz||{}; s.checkins=s.checkins||[]; s.log=s.log||[]; s.badges=s.badges||{}; return s; }
function load(){ try{ var v=JSON.parse(localStorage.getItem(KEY)); return v && v.v===1 ? norm(v) : null; }catch(e){ return null; } }
function persistLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ persistLocal(); queueCloudSave(); }
var S = load() || zeroState();

function totalPts(){ return S.log.reduce(function(a,b){ return a+b.n; },0); }
function weekPts(){ var w=dkey(weekDays()[0]); return S.log.filter(function(x){ return x.d>=w; }).reduce(function(a,b){ return a+b.n; },0); }
function lessonsDone(){ return UNITS.filter(function(u){ return S.lessons[u.id]; }).length; }
function qid(u,i){ return u.id+"-"+i; }
function mastered(u){ var m=0; u.quiz.forEach(function(_,i){ if(S.qa[qid(u,i)]) m++; }); return m; }
function totalQs(){ return UNITS.reduce(function(a,u){ return a+u.quiz.length; },0); }
function totalCards(){ return UNITS.reduce(function(a,u){ return a+u.cards.length; },0); }
function masteredAll(){ return UNITS.reduce(function(a,u){ return a+mastered(u); },0); }
function perfectAny(){ if(Object.keys(S.perfect).length) return true; return Object.keys(S.quiz).some(function(k){ var q=S.quiz[k]; return q && q.best>=(q.of||5); }); }
function unitsQuizzed(){ return UNITS.filter(function(u){ return S.quiz[u.id]; }).length; }
function curStreak(){ return (S.last===today()||S.last===daysAgo(1)) ? S.streak : 0; }
function levelIdx(p){ var i=0; LEVELS.forEach(function(l,j){ if(p>=l.p) i=j; }); return i; }
function initials(n){ var p=String(n).replace(/[^A-Za-z0-9 _]/g,"").split(/[ _]+/).filter(Boolean); if(!p.length) return "?"; if(p.length===1){ var m=p[0].match(/[A-Z]/g); return (m&&m.length>1? m[0]+m[1] : p[0].slice(0,2)).toUpperCase(); } return (p[0][0]+p[1][0]).toUpperCase(); }
function avColor(n){ var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return AVC[h%AVC.length]; }
function checked(id,day){ return S.checkins.some(function(x){ return x.c===id && x.d===day; }); }
function weekCheckins(){ var w=dkey(weekDays()[0]); return S.checkins.filter(function(x){ return x.d>=w; }).length; }
function board(mode){
  var rows;
  rows = (C.board[mode]||[]).filter(function(r){ return !r.is_me; }).map(function(r){ return {n:r.nick, pts:r.pts}; });
  rows.push({n:S.nick, me:true, pts: mode==="week"? weekPts() : totalPts()});
  rows.sort(function(a,b){ return (b.pts-a.pts) || (a.me?-1:(b.me?1:0)); });
  return rows;
}
function myRank(mode){ var r=board(mode); for(var i=0;i<r.length;i++) if(r[i].me) return i+1; return r.length; }
function touch(){ var t=today(); if(S.last===t) return; S.streak = (S.last===daysAgo(1)) ? S.streak+1 : 1; S.last=t; }

var BADGES = [
  {id:"sprout", name:"First Sprout", desc:"Finish your first lesson", icon:"sprout", c:"#3F7E44", prog:function(){ return [lessonsDone(),1]; }},
  {id:"getter", name:"Goal Getter", desc:"Finish all four lessons", icon:"globe", c:"#19486A", prog:function(){ return [lessonsDone(),4]; }},
  {id:"ace", name:"Sharp Mind", desc:"Get a perfect score in any quiz", icon:"target", c:"#C5192D", prog:function(){ return [perfectAny()?1:0,1]; }},
  {id:"explorer", name:"Quiz Explorer", desc:"Take the quiz for every unit", icon:"compass", c:"#0A97D9", prog:function(){ return [unitsQuizzed(),4]; }},
  {id:"starter", name:"Action Starter", desc:"Check in your first eco-action", icon:"leaf", c:"#4C9F38", prog:function(){ return [S.checkins.length,1]; }},
  {id:"habit", name:"Habit Builder", desc:"Reach 10 eco-action check-ins", icon:"recycle", c:"#BF8B2E", prog:function(){ return [S.checkins.length,10]; }},
  {id:"roll", name:"On a Roll", desc:"Keep a three-day streak", icon:"flame", c:"#FD6925", prog:function(){ return [curStreak(),3]; }},
  {id:"podium", name:"Top Three", desc:"Reach the top 3 this week", icon:"trophy", c:"#FCC30B", ink:"#2B2100", prog:function(){ return [(weekPts()>0 && (!C.on || C.board.week) && myRank("week")<=3)?1:0,1]; }}
];

/* ---------- ui state ---------- */
var TABS = ["learn","quiz","badges","challenges","leaderboard"];
var tab = "learn", firstPaint = true, justGrew = null;
var L = null, Q = null, boardMode = "week", badgeQ = [], shownPts = null;

function fillStaticIcons(){
  $$("[data-ic]").forEach(function(el){ el.innerHTML = ic(el.getAttribute("data-ic")); });
  $$("[data-icx]").forEach(function(el){ el.insertAdjacentHTML("afterbegin", ic("x")); });

function go(t){
  if(TABS.indexOf(t)<0) t="learn";
  tab=t;
  $$(".tab").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab===t)); });
  $$(".about-nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===t); });
  render();
  $("#view").scrollTop = 0;
  try{ history.replaceState(null,"","#"+t); }catch(e){}
  if(t==="leaderboard" || t==="challenges") refreshShared();
}
function render(){
  var f = {learn:renderLearn, quiz:renderQuiz, badges:renderBadges, challenges:renderChallenges, leaderboard:renderBoard}[tab];
  $("#view").innerHTML = f();
  if(tab==="learn" && !L) justGrew = null;
  firstPaint = false;
}
function renderHeader(animate){
  $("#streakN").textContent = curStreak();
  $("#avatar").textContent = initials(S.nick);
  var p = totalPts();
  if(!animate || reduced || shownPts===null){ shownPts=p; $("#ptsN").textContent=p; return; }
  var from=shownPts, t0=performance.now(), dur=650, el=$("#ptsN"); shownPts=p;
  (function step(now){ var k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(p-from)*e); if(k<1) requestAnimationFrame(step); })(t0);
  var pill=$("#ptsPill"); if(pill.animate) pill.animate([{transform:"scale(1)"},{transform:"scale(1.2)"},{transform:"scale(1)"}],{duration:450,easing:"ease-out"});
}
function greeting(){ var h=new Date().getHours(); return h<12?"Good morning":(h<18?"Good afternoon":"Good evening"); }
function toast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#app").appendChild(t); setTimeout(function(){ t.remove(); }, 2500); }

/* ---------- points + badges ---------- */
function award(n, rect){
  var before=levelIdx(totalPts());
  var last = S.log[S.log.length-1], t=today();
  if(last && last.d===t) last.n += n; else S.log.push({d:t,n:n});
  touch(); save();
  var after=levelIdx(totalPts());
  if(after>before) badgeQ.push({level:true, name:LEVELS[after].n, desc:"You reached level "+(after+1)+" with "+totalPts()+" points. Keep growing!", icon:"sprout", c:"#1C8549"});
  if(reduced || !rect){ renderHeader(true); SFX.play("coin"); }
  else floatPts(n, rect, function(){ renderHeader(true); SFX.play("coin"); });
  setTimeout(checkBadges, reduced ? 60 : 950);
}
function floatPts(n, rect, done){
  var app=$("#app"), ar=app.getBoundingClientRect(), pr=$("#ptsPill").getBoundingClientRect();
  var el=document.createElement("div"); el.className="float-pts"; el.textContent="+"+n; app.appendChild(el);
  var x0=rect.left+rect.width/2-ar.left, y0=rect.top+rect.height/2-ar.top, x1=pr.left+pr.width/2-ar.left, y1=pr.top+pr.height/2-ar.top;
  el.style.left=x0+"px"; el.style.top=y0+"px";
  if(!el.animate){ el.remove(); done(); return; }
  var a = el.animate([
    {transform:"translate(-50%,-50%) scale(.5)", opacity:0},
    {transform:"translate(-50%,-110%) scale(1.25)", opacity:1, offset:.28},
    {transform:"translate(calc(-50% + "+(x1-x0)+"px), calc(-50% + "+(y1-y0)+"px)) scale(.6)", opacity:.85}
  ], {duration:950, easing:"cubic-bezier(.3,.7,.2,1)"});
  a.onfinish = function(){ el.remove(); done(); };
}
function checkBadges(){
  var any=false;
  BADGES.forEach(function(b){ if(S.badges[b.id]) return; var p=b.prog(); if(p[0]>=p[1]){ S.badges[b.id]=today(); badgeQ.push(b); any=true; } });
  if(any){ save(); if(tab==="badges") render(); }
  if(badgeQ.length && !$("#modal").innerHTML) showBadge();
}
function showBadge(){
  var b=badgeQ.shift(); if(!b) return;
  $("#modal").innerHTML = '<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="bm-t">'+
    '<div class="emb" style="--bc:'+b.c+';'+(b.ink?'--bi:'+b.ink:'')+'">'+ic(b.icon)+'</div>'+
    '<p class="eyebrow">'+(b.level?"Level up!":"Badge unlocked")+'</p><h2 id="bm-t">'+b.name+'</h2><p>'+b.desc+'</p>'+
    '<button class="btn" data-act="badgeOk">'+(b.level?"Let’s go":"Nice!")+'</button></div></div>';
  confetti(); SFX.play(b.level?"levelup":"badge"); SFX.buzz([20,40,20,40,60]);
  var btn=$("#modal .btn"); if(btn) btn.focus();
}
function confetti(){
  if(reduced) return;
  var c=$("#confetti"), r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1, ctx=c.getContext("2d");
  c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols=["#C5192D","#BF8B2E","#3F7E44","#19486A","#FCC30B","#0A97D9","#FD6925","#DD1367"];
  var P=[]; for(var i=0;i<140;i++) P.push({x:r.width/2, y:r.height*.42, vx:(Math.random()-.5)*11, vy:-Math.random()*11-3, s:5+Math.random()*6, rot:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[i%cols.length]});
  var f=0;
  (function step(){
    ctx.clearRect(0,0,r.width,r.height); f++;
    P.forEach(function(p){ p.vy+=.3; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-f/150); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(f<150) requestAnimationFrame(step); else ctx.clearRect(0,0,r.width,r.height);
  })();
}

/* ---------- LEARN ---------- */
function plantSVG(){
  var done=lessonsDone();
  var spots=[{x:60,y:132,r:-18,f:false},{x:59,y:110,r:-24,f:true},{x:61,y:86,r:-28,f:false},{x:59.5,y:62,r:-30,f:true}];
  var leaf="M0 0 C7 -13 27 -15 38 -6 C29 5 12 8 0 0Z", vein="M3 -1 C13 -5 23 -7 33 -6";
  var leaves = spots.map(function(s,i){
    var u=UNITS[i], on=!!S.lessons[u.id], pop=(justGrew===u.id)||(firstPaint&&on);
    var tr="translate("+s.x+" "+s.y+")"+(s.f?" scale(-1 1)":"")+" rotate("+s.r+")";
    return '<g transform="'+tr+'"><path class="leaf '+(on?"on":"off")+(pop?" pop":"")+'" d="'+leaf+'" style="--c:'+u.color+';--d:'+(firstPaint?(0.5+i*0.15):0.1)+'s"/>'+(on?'<path class="vein" d="'+vein+'"/>':'')+'</g>';
  }).join("");
  var top = done===4
    ? '<g class="bloom">'+UNITS.map(function(u,i){ var a=i*90+45; return '<ellipse cx="60" cy="18" rx="6" ry="10" fill="'+u.color+'" transform="rotate('+a+' 60 28)"/>'; }).join("")+'<circle cx="60" cy="28" r="5.5" fill="#FCC30B"/></g>'
    : '<ellipse cx="60" cy="30" rx="4.5" ry="7" fill="var(--stem)"/>';
  return '<svg class="plant" viewBox="0 0 120 170" role="img" aria-label="SDG plant with '+done+' of 4 leaves">'+
    '<ellipse cx="60" cy="160" rx="42" ry="7" fill="var(--soil)"/>'+
    '<path class="stem'+(firstPaint?" draw":"")+'" pathLength="1" d="M60 158 C58 134 64 114 59.5 94 S57.5 56 60 34" fill="none" stroke="var(--stem)" stroke-width="4" stroke-linecap="round"/>'+
    leaves + top + '</svg>';
}
function renderLearn(){
  var done=lessonsDone(), next=null;
  for(var i=0;i<UNITS.length;i++) if(!S.lessons[UNITS[i].id]){ next=UNITS[i]; break; }
  var rows = UNITS.map(function(u){
    var ld=!!S.lessons[u.id], q=S.quiz[u.id], isNext=next&&next.id===u.id;
    var status = ld ? '<span class="status done">'+ic("check")+'Lesson done · '+(q?'Quiz mastery '+mastered(u)+'/'+u.quiz.length:'Quiz not taken')+'</span>'
                    : '<span class="status">'+u.cards.length+' cards · about 3 min</span>';
    var end = ld ? '<span class="ok-dot">'+ic("check")+'</span>' : (isNext ? '<span class="chip next">Start</span>' : ic("chev"));
    return '<button class="unit'+(ld?" is-done":"")+(isNext?" is-next":"")+'" data-act="lesson" data-u="'+u.id+'" style="--unit:'+u.color+'">'+
      '<span class="sdg-tile"><small>SDG</small><b>'+u.sdg+'</b></span>'+
      '<span class="unit-main"><span class="eyebrow">Unit '+u.n+'</span><span class="unit-title">'+u.title+'</span><span class="unit-sub">'+u.short+'</span>'+status+'</span>'+
      '<span class="unit-end">'+end+'</span></button>';
  }).join("");
  var cta = next
    ? '<button class="btn sm" data-act="lesson" data-u="'+next.id+'">'+(done?"Continue":"Start")+': Unit '+next.n+ic("chev")+'</button>'
    : '<span class="chip good">'+ic("check")+'All four units done</span>';
  return '<section class="screen">'+
    '<div class="head"><p class="eyebrow">'+greeting()+', '+esc(S.nick)+'</p><h1 class="h1">Grow your SDG plant</h1></div>'+
    '<div class="grow card">'+plantSVG()+'<div class="grow-text"><p class="eyebrow">Your plant</p><p class="grow-big">'+done+' <span>of 4 leaves</span></p><p class="muted">Each lesson you finish grows a leaf in that goal’s colour.</p>'+cta+'</div></div>'+
    '<div class="sec-head"><h2 class="h2">Learning path</h2><span class="muted smt">'+UNITS.length+' units · '+totalCards()+' cards · '+totalQs()+' questions</span></div>'+
    '<div class="units">'+rows+'</div></section>';
}
function openLesson(id){
  var u=null; UNITS.forEach(function(x){ if(x.id===id) u=x; });
  L={u:u, i:0, done:false, dir:0, gained:0, fresh:true};
  drawLesson();
}
function drawLesson(){
  var u=L.u, n=u.cards.length, inner;
  var segs = u.cards.map(function(_,j){ return '<span class="'+((j<L.i||L.done)?"on":(j===L.i?"cur":""))+'"></span>'; }).join("");
  if(!L.done){
    var c=u.cards[L.i];
    inner = '<div class="lesson-scroll"><div class="lesson-head"><span class="sdg-tile sm"><small>SDG</small><b>'+u.sdg+'</b></span><div><p class="eyebrow">Unit '+u.n+' · '+u.goal+'</p><p class="lesson-unit">'+u.title+'</p></div></div>'+
      '<article class="lesson-card '+(L.dir>0?"slide-r":(L.dir<0?"slide-l":""))+'"><span class="card-num" aria-hidden="true">'+pad(L.i+1)+'</span><h2>'+c.t+'</h2><p>'+c.b+'</p>'+
      '<div class="fact">'+ic("bulb")+'<div><b>Did you know?</b><p>'+c.f+'</p></div></div></article></div>'+
      '<div class="sheet-foot"><button class="btn ghost" data-act="lessonPrev" '+(L.i===0?"disabled":"")+'>'+ic("back")+'Back</button>'+
      '<button class="btn" data-act="lessonNext">'+(L.i===n-1?"Finish lesson":"Next")+ic(L.i===n-1?"check":"arrow")+'</button></div>';
  } else {

      '<p class="muted">'+(L.gained?'+20 points and a new '+u.title.toLowerCase().replace(/^the /,"")+' leaf on your plant.':'You already grew this leaf. Nice refresher.')+'</p>'+

  }

    '<div class="sheet-top"><button class="icon-btn" data-act="closeLesson" aria-label="Close lesson">'+ic("x")+'</button><div class="segs">'+segs+'</div><span class="q-count">'+(L.done?n:L.i+1)+'/'+n+'</span></div>'+inner+'</div>';
  L.fresh=false;
}
function finishLesson(btn){
  var rect=btn.getBoundingClientRect();
  L.done=true; SFX.play("complete"); SFX.buzz(20);
  if(!S.lessons[L.u.id]){ S.lessons[L.u.id]=true; justGrew=L.u.id; L.gained=20; drawLesson(); award(20, rect); }
  else drawLesson();
  if(!reduced) confettiLight();
}
function confettiLight(){ /* small celebration reuses the main burst */ confetti(); }
function closeLesson(){ L=null; $("#sheet").innerHTML=""; if(tab==="learn") render(); }

/* ---------- QUIZ ---------- */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function startQuiz(id){
  var pool=[];
  UNITS.forEach(function(u){ if(id==="mix" || u.id===id) u.quiz.forEach(function(q,i){ pool.push({id:qid(u,i), q:q.q, o:q.o, a:q.a, why:q.why, tf:q.tf, u:u}); }); });
  /* questions you have not mastered yet come first, so every round teaches something new */
  var fresh=shuffle(pool.filter(function(q){ return !S.qa[q.id]; })), known=shuffle(pool.filter(function(q){ return S.qa[q.id]; }));
  var items=shuffle(fresh.concat(known).slice(0, id==="mix" ? QN_MIX : QN_UNIT));
  items=items.map(function(q){
    if(q.tf) return {id:q.id, q:q.q, o:q.o, a:q.a, why:q.why, tf:true, u:q.u};
    var idx=shuffle([0,1,2,3]); return {id:q.id, q:q.q, o:idx.map(function(i){ return q.o[i]; }), a:idx.indexOf(q.a), why:q.why, u:q.u};
  });
  Q={id:id, items:items, i:0, picked:null, res:[], earned:0, done:false, combo:0, bestCombo:0, gains:[]};
  SFX.play("start");
  if(tab!=="quiz") go("quiz"); else { render(); $("#view").scrollTop=0; }
}
function renderQuiz(){
  if(Q && Q.done) return quizResult();
  if(Q) return quizQuestion();
  var rows = UNITS.map(function(u){
    var q=S.quiz[u.id], m=mastered(u), tot=u.quiz.length;
    var sub = q ? 'Best '+q.best+'/'+(q.of||5)+' · mastered '+m+'/'+tot : QN_UNIT+' questions a round · '+tot+' in this unit';
    return '<button class="qrow" data-act="startQuiz" data-q="'+u.id+'" style="--unit:'+u.color+'">'+
      '<span class="sdg-tile sm"><small>SDG</small><b>'+u.sdg+'</b></span>'+
      '<span><span class="t" style="display:block">Unit '+u.n+': '+u.title+'</span><span class="s" style="display:block">'+sub+'</span><span class="mbar" aria-hidden="true"><i style="--w:'+Math.round(m/tot*100)+'%"></i></span></span>'+
      '<span class="unit-end">'+ic("chev")+'</span></button>';
  }).join("");
  var art = UNITS.map(function(u){ return '<span style="background:'+u.color+'">'+u.sdg+'</span>'; }).join("");
  var mixDone = S.mixDay===today();
  return '<section class="screen">'+
    '<div class="head"><p class="eyebrow">Quiz</p><h1 class="h1">Test what you know</h1></div>'+
    '<div class="mix"><div><p class="eyebrow">Daily mix</p><h2>'+QN_MIX+' questions from every unit</h2><p>'+(mixDone?"Today’s bonus is in the bag. Play again any time for practice.":"Finish today’s mix for a +"+MIX_BONUS+" bonus.")+'</p><button class="btn" data-act="startQuiz" data-q="mix">'+ic("shuffle")+(mixDone?"Play again":"Start the mix")+'</button></div><div class="mix-art" aria-hidden="true">'+art+'</div></div>'+
    '<div class="rules"><div class="rule"><b>+10</b><span>first time you get a question right</span></div><div class="rule"><b>+10</b><span>first perfect score in a unit</span></div><div class="rule"><b>+'+MIX_BONUS+'</b><span>daily mix, once a day</span></div></div>'+
    '<div class="sec-head"><h2 class="h2">Unit quizzes</h2><span class="muted smt">'+masteredAll()+' of '+totalQs()+' mastered</span></div>'+

function quizQuestion(){
  var it=Q.items[Q.i], n=Q.items.length, picked=Q.picked;

  var opts = it.o.map(function(o,i){

    return '<button class="opt'+cls+'" data-act="pick" data-i="'+i+'" '+(picked!==null?"disabled":"")+'><span class="k">'+"ABCD"[i]+'</span><span>'+o+'</span><span class="mk">'+ic(i===it.a?"check":"x")+'</span></button>';
  }).join("");
  var fb="";
  if(picked!==null){
    var ok=picked===it.a, g=Q.gains[Q.i];
    fb = '<div class="feedback '+(ok?"ok":"no")+'" role="status"><div class="fb-h">'+ic(ok?"check":"x")+(ok?"Correct":"Not quite")+(ok?'<span class="fb-tag">'+(g?"+"+g+" points":"Already mastered")+'</span>':'')+'</div>'+
      (ok && Q.combo>=3 ? '<span class="combo">'+ic("flame")+Q.combo+' in a row</span>' : '')+
      (!ok ? '<p><strong>Answer: '+it.o[it.a]+'.</strong></p>' : '')+'<p>'+it.why+'</p>'+
      '<button class="btn block" data-act="nextQ">'+(Q.i===n-1?"See my score":"Next question")+ic("arrow")+'</button></div>';
  }

    '<div class="q-top"><button class="icon-btn" data-act="quitQuiz" aria-label="Quit quiz">'+ic("x")+'</button><div class="segs">'+segs+'</div><span class="q-count">'+(Q.i+1)+'/'+n+'</span></div>'+
    '<div class="q-card"><span class="unit-chip"><span>'+it.u.sdg+'</span>Unit '+it.u.n+' · '+it.u.title+'</span><h2 class="q-text">'+it.q+'</h2></div>'+

function quizResult(){
  var n=Q.items.length, sc=Q.res.filter(Boolean).length, pct=Math.round(sc/n*100);
  var unit = Q.id==="mix" ? null : Q.items[0].u;
  var color = unit ? unit.color : "var(--accent)";
  var perfect = sc===n;
  var head = perfect ? "Perfect score!" : (pct>=60 ? "Nicely done" : "Keep growing");
  var sub = perfect ? (Q.firstPerfect ? "Every answer right. Your first perfect score here earns a +10 bonus." : "Every answer right. Your knowledge is growing strong.")
                    : (pct>=60 ? "Check the answers you missed below, then go again." : "Read the lesson again, then have another go.");
  var recap = Q.items.map(function(it,i){ return '<li class="'+(Q.res[i]?"y":"n")+'">'+ic(Q.res[i]?"check":"x")+'<span>'+it.q+(Q.res[i]?'':'<small>Answer: <b>'+it.o[it.a]+'</b></small>')+'</span></li>'; }).join("");
  var lessonBtn = (unit && !S.lessons[unit.id]) ? '<button class="btn ghost" data-act="lesson" data-u="'+unit.id+'">Read the Unit '+unit.n+' lesson</button>' : '';
  var chips = '<span class="chip sun">'+ic("star")+'+'+Q.earned+' points</span>';
  if(Q.mixBonus) chips += '<span class="chip good">'+ic("check")+'Daily bonus +'+MIX_BONUS+'</span>';
  if(Q.bestCombo>=3) chips += '<span class="chip">'+ic("flame")+'Best streak '+Q.bestCombo+'</span>';
  if(unit) chips += '<span class="chip">Mastered '+mastered(unit)+'/'+unit.quiz.length+'</span>';
  return '<section class="screen result" style="--unit:'+color+'">'+
    '<p class="eyebrow">'+(unit?'Unit '+unit.n+' quiz':'Daily mix')+'</p>'+
    '<div class="ring" id="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="50"/><circle class="val" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="'+pct+' 100"/></svg>'+
    '<div class="ring-c"><b>'+sc+'/'+n+'</b><span>correct</span></div></div>'+
    '<h1 class="h1">'+head+'</h1><p class="muted">'+sub+'</p>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="recap"><ul>'+recap+'</ul></div>'+
    '<div class="acts"><button class="btn" data-act="startQuiz" data-q="'+Q.id+'">New round</button>'+lessonBtn+'<button class="btn ghost" data-act="quizHome">All quizzes</button></div></section>';
}
function pick(i, btn){
  if(!Q || Q.picked!==null) return;
  var it=Q.items[Q.i], ok=i===it.a, rect=btn.getBoundingClientRect(), gain=0;
  Q.picked=i; Q.res.push(ok);
  if(ok){ Q.combo++; Q.bestCombo=Math.max(Q.bestCombo,Q.combo); if(!S.qa[it.id]){ S.qa[it.id]=today(); gain=10; } }
  else Q.combo=0;
  Q.gains[Q.i]=gain;
  render();
  var nb=$('.opt[data-i="'+i+'"]'); if(nb) nb.classList.add(ok?"pulse":"shake");
  if(ok){ SFX.play("correct", Q.combo); SFX.buzz(12); } else { SFX.play("wrong"); SFX.buzz([30,50,30]); }
  if(gain){ Q.earned+=gain; award(gain, rect); } else save();
  var fb=$(".feedback"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest", behavior: reduced?"auto":"smooth"});
}
function nextQ(){
  Q.i++; Q.picked=null;
  if(Q.i>=Q.items.length){
    Q.done=true;
    var sc=Q.res.filter(Boolean).length, n=Q.items.length, prev=S.quiz[Q.id], bonus=0;
    S.quiz[Q.id]={best:(prev && (prev.of||5)===n) ? Math.max(prev.best, sc) : sc, of:n, taken:(prev?prev.taken:0)+1};
    var perfect = sc===n;
    if(perfect && Q.id!=="mix" && !S.perfect[Q.id]){ S.perfect[Q.id]=today(); Q.firstPerfect=true; bonus+=10; }
    if(Q.id==="mix" && S.mixDay!==today()){ S.mixDay=today(); Q.mixBonus=true; bonus+=MIX_BONUS; }
    Q.earned+=bonus;
    save(); render(); $("#view").scrollTop=0;
    SFX.play(perfect ? "perfect" : "done");
    if(perfect) confetti();
    if(bonus){ var r=$("#ring"); setTimeout(function(){ award(bonus, r ? r.getBoundingClientRect() : null); }, 350); }
    else { touch(); save(); renderHeader(false); setTimeout(checkBadges, 300); }
  } else { SFX.play("tap"); render(); $("#view").scrollTop=0; }
}

function cloudSave(){

    setStatus("synced"); refreshShared();
  }, function(e){ console.warn("EcoLingo save:", e); setStatus("error"); });

/* combine two progress snapshots without losing anything */
function mergeState(a, b){
  var m=zeroState(a.nick||b.nick), k;
  [a,b].forEach(function(s){
    for(k in (s.lessons||{})) if(s.lessons[k]) m.lessons[k]=true;
    for(k in (s.quiz||{})){ var q=s.quiz[k], p=m.quiz[k], qo=q.of||5;
      if(!p || qo>(p.of||5)) m.quiz[k]={best:q.best||0, of:qo, taken:Math.max(p?p.taken:0,q.taken||0)};
      else m.quiz[k]={best:(qo===(p.of||5))?Math.max(p.best,q.best||0):p.best, of:p.of||5, taken:Math.max(p.taken,q.taken||0)}; }
    for(k in (s.qa||{})) if(s.qa[k] && (!m.qa[k] || s.qa[k]<m.qa[k])) m.qa[k]=s.qa[k];
    for(k in (s.perfect||{})) if(!m.perfect[k] || s.perfect[k]<m.perfect[k]) m.perfect[k]=s.perfect[k];
    if((s.mixDay||"")>m.mixDay) m.mixDay=s.mixDay;
    if(s.onb) m.onb=true;
    for(k in (s.badges||{})) if(!m.badges[k] || s.badges[k]<m.badges[k]) m.badges[k]=s.badges[k];
  });
  var seen={}; a.checkins.concat(b.checkins).forEach(function(x){ var id=x.c+"|"+x.d; if(!seen[id]){ seen[id]=1; m.checkins.push({c:x.c,d:x.d}); } });
  var days={}; a.log.concat(b.log).forEach(function(x){ days[x.d]=Math.max(days[x.d]||0, x.n); });
  m.log=Object.keys(days).sort().map(function(d){ return {d:d,n:days[d]}; });
  var w=(a.last||"")>(b.last||"") ? a : ((b.last||"")>(a.last||"") ? b : (a.streak>=b.streak?a:b));
  m.streak=w.streak||0; m.last=w.last||"";
  return m;
}

function adoptUser(user){
  C.user=user; C.uid=user.id; setStatus("syncing"); refreshAcct();
  return sb.from("profiles").select("nick,state").eq("id", user.id).maybeSingle().then(function(r){
    if(C.uid!==user.id) return;
    if(r.error) throw r.error;
    if(r.data && r.data.state && r.data.state.v===1){
      var before=JSON.stringify(S), m=mergeState(norm(r.data.state), S);
      m.nick = r.data.nick || m.nick;
      if(JSON.stringify(m)!==before){ S=m; persistLocal(); shownPts=null; renderHeader(false); if(!Q && !L) render(); var ni=$("#nick"); if(ni && document.activeElement!==ni) ni.value=S.nick; }
    }
    return cloudSave();
  }).then(function(){ refreshAcct(); }, function(e){ console.warn("EcoLingo sync:", e); setStatus("error"); });
}

function onSession(ev, session){
  if(session && session.user){
    C.user=session.user;
    if(C.uid!==session.user.id) adoptUser(session.user); else refreshAcct();
  } else if(ev==="INITIAL_SESSION" || ev==="SIGNED_OUT"){
    C.user=null; C.uid=null; signInGuest();
  }
}
function signInGuest(){
  setStatus("connecting");
  sb.auth.signInAnonymously().then(function(r){
    if(r.error){ console.warn("EcoLingo: guest sign-in failed. Is 'Allow anonymous sign-ins' on in Supabase?", r.error); setStatus("error"); }
  }, function(e){ console.warn(e); setStatus("error"); });
}

var lastShared="";
function refreshShared(){
  if(!sb) return;
  Promise.all([ sb.rpc("get_leaderboard",{mode:"week"}), sb.rpc("get_leaderboard",{mode:"all"}), sb.rpc("community_week_checkins") ]).then(function(rs){
    if(!rs[0].error) C.board.week=rs[0].data||[];
    if(!rs[1].error) C.board.all=rs[1].data||[];
    if(!rs[2].error && typeof rs[2].data==="number") C.community=rs[2].data;
    var sig=JSON.stringify([C.board, C.community]); if(sig===lastShared) return; lastShared=sig;
    if(tab==="leaderboard" && !L) render();
    if(tab==="challenges"){
      var wc=weekCheckins(), comm=Math.max(C.community==null?wc:C.community, wc), n=$("#commN"), b=$("#commBar");
      if(n) n.textContent=comm+" / "+COMMUNITY_GOAL; if(b) b.style.setProperty("--w", Math.min(100, Math.round(comm/COMMUNITY_GOAL*100))+"%");
    }
    checkBadges();
  }, function(e){ console.warn("EcoLingo leaderboard:", e); });
}

function sendCode(raw){
  var email=String(raw||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ say("Please enter a valid email address.", true); refreshAcct(); return; }
  C.busy=true; say("Sending…"); refreshAcct();
  sb.auth.signInWithOtp({ email:email, options:{ shouldCreateUser:true, emailRedirectTo: location.origin + location.pathname } }).then(function(r){
    C.busy=false;
    if(r.error){ say(r.error.message, true); }
    else {
      C.otpEmail=email; say("Email sent. Check your inbox (and spam).");
      /* the guest row is removed now so you don't appear twice after the link signs you in;
         progress stays on this device and is merged into the account when you come back */
      if(C.user && C.user.is_anonymous && C.uid){ clearTimeout(C.t); C.hold=true; sb.from("profiles").delete().eq("id", C.uid).then(function(){}, function(){}); }
    }
    refreshAcct(); var i=$(C.otpEmail?"#otp":"#email"); if(i) i.focus();
  });
}
function verifyCode(raw){
  var code=String(raw||"").replace(/\D/g,"");
  if(code.length<6){ say("Please enter the full code from the email.", true); refreshAcct(); return; }
  var guestId = (C.user && C.user.is_anonymous) ? C.uid : null;
  C.busy=true; say("Checking…"); refreshAcct();
  /* remove the guest row first so the same person does not appear twice on the leaderboard;
     progress is still in S and gets merged into the account right after */
  clearTimeout(C.t); C.hold=true;
  var pre = guestId ? sb.from("profiles").delete().eq("id", guestId) : Promise.resolve({});
  Promise.resolve(pre).then(function(){
    return sb.auth.verifyOtp({ email:C.otpEmail, token:code, type:"email" });
  }).then(function(r){
    C.busy=false; C.hold=false;
    if(r.error){ say(r.error.message, true); refreshAcct(); cloudSave(); return; }
    C.otpEmail=""; say("You're signed in. Progress from this device was added to your account.");
    if(r.data && r.data.session) onSession("SIGNED_IN", r.data.session); else refreshAcct();
    toast("Signed in");
  }, function(e){ C.busy=false; C.hold=false; say(String(e&&e.message||e), true); refreshAcct(); cloudSave(); });
}
function signOut(){
  C.busy=true; refreshAcct();
  var flush = C.t ? cloudSave() : Promise.resolve();
  flush.then(function(){ return sb.auth.signOut(); }).then(function(){
    C.busy=false; say("");
    var nick=S.nick; S=zeroState(nick); persistLocal(); C.board={week:null,all:null}; lastShared="";
    shownPts=null; renderHeader(false); closeSheet(); render(); toast("Signed out");
    /* SIGNED_OUT event starts a fresh guest session */
  });
}

function cloudBoot(){
  $$("[data-cloud-hide]").forEach(function(el){ el.remove(); });
  sb.auth.onAuthStateChange(function(ev, session){ setTimeout(function(){ onSession(ev, session); }, 0); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden" && C.t) cloudSave(); });
  window.addEventListener("online", function(){ if(C.uid) cloudSave(); });
}

/* ---------- sound + haptics (synthesised, no audio files) ---------- */
var SFX=(function(){
  var KEY_S="ecolingo-sound", on=true, ctx=null, out=null, noise=null;
  try{ on = localStorage.getItem(KEY_S)!=="off"; }catch(e){}
  function ac(){
    if(!ctx){
      var A=window.AudioContext||window.webkitAudioContext; if(!A) return null;
      try{ ctx=new A(); }catch(e){ return null; }
      var comp=ctx.createDynamicsCompressor(); out=ctx.createGain(); out.gain.value=0.6; out.connect(comp); comp.connect(ctx.destination);
    }
    if(ctx.state==="suspended" && ctx.resume) ctx.resume();
    return ctx;
  }
  function tone(f, t, d, o){
    o=o||{}; var s=ctx.currentTime+t, osc=ctx.createOscillator(), g=ctx.createGain(), v=o.vol||0.15;
    osc.type=o.type||"sine"; osc.frequency.setValueAtTime(f, s); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, s+d);
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(v, s+(o.atk||0.008)); g.gain.exponentialRampToValueAtTime(0.0001, s+d);
    osc.connect(g); g.connect(out); osc.start(s); osc.stop(s+d+0.05);
  }
  function hiss(t, d, o){
    o=o||{};
    if(!noise){ noise=ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.5), ctx.sampleRate); var ch=noise.getChannelData(0); for(var i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
    var s=ctx.currentTime+t, src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=noise; f.type=o.filter||"bandpass"; f.frequency.setValueAtTime(o.f||1200, s); if(o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, s+d); f.Q.value=o.q||1;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(o.vol||0.1, s+0.01); g.gain.exponentialRampToValueAtTime(0.0001, s+d);
    src.connect(f); f.connect(g); g.connect(out); src.start(s); src.stop(s+d+0.05);
  }
  var C4=261.63, E4=329.63, G4=392, C5=523.25, D5=587.33, E5=659.25, G5=783.99, A5=880, C6=1046.5, E6=1318.5, G6=1568;
  function arp(notes, gap, d, o){ notes.forEach(function(f,i){ tone(f, i*gap, d, o); }); }
  var lib={
    tap:function(){ tone(900,0,.05,{type:"triangle",vol:.05,to:700}); },
    flip:function(){ hiss(0,.18,{f:700,fto:3000,vol:.06,q:.7}); },
    start:function(){ tone(G4,0,.12,{type:"triangle",vol:.09}); tone(C5,.08,.2,{type:"triangle",vol:.11}); },
    correct:function(k){ var m=Math.pow(1.0595, Math.min(k||1,8)-1); tone(E5*m,0,.14,{vol:.15}); tone(A5*m,.08,.28,{vol:.15}); tone(E6*m,.16,.24,{vol:.04}); },
    wrong:function(){ tone(196,0,.22,{type:"triangle",vol:.14,to:150}); tone(147,.11,.28,{type:"triangle",vol:.11,to:110}); },
    coin:function(){ tone(C6,0,.07,{type:"square",vol:.03}); tone(G6,.06,.18,{type:"square",vol:.03}); },
    stamp:function(){ hiss(0,.1,{filter:"lowpass",f:500,vol:.22}); tone(120,0,.14,{vol:.2,to:55}); tone(C5,.1,.14,{vol:.09}); tone(G5,.18,.26,{vol:.09}); },
    complete:function(){ arp([C5,E5,G5],.09,.24,{type:"triangle",vol:.11}); tone(C6,.27,.45,{vol:.11}); },
    done:function(){ tone(G4,0,.18,{type:"triangle",vol:.1}); tone(C5,.13,.34,{type:"triangle",vol:.1}); },
    perfect:function(){ arp([C5,E5,G5,C6],.08,.22,{type:"triangle",vol:.11}); arp([E6,G6],.06,.4,{vol:.04}); },
    badge:function(){ arp([G4,C5,E5,G5,C6],.07,.26,{type:"triangle",vol:.1}); tone(C6,.38,.7,{vol:.07}); tone(E6,.38,.6,{vol:.04}); },
    levelup:function(){ [C4,E4,G4].forEach(function(f){ tone(f*2,0,.22,{type:"triangle",vol:.07}); }); [D5,G5,A5*1.0].forEach(function(f){ tone(f,.18,.22,{type:"triangle",vol:.06}); }); [C5,E5,G5,C6].forEach(function(f){ tone(f,.38,.8,{type:"triangle",vol:.07}); }); tone(G6,.42,.6,{vol:.03}); }
  };
  return {
    play:function(n,a){ if(!on || !lib[n] || !ac()) return; try{ lib[n](a); }catch(e){} },
    buzz:function(p){ if(on && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } },
    isOn:function(){ return on; },
    set:function(v){ on=!!v; try{ localStorage.setItem(KEY_S, on?"on":"off"); }catch(e){} }
  };
})();

/* ---------- install as an app (PWA) ---------- */
var installEvt=null;
var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true; }
function installHTML(inSheet){
  if(isStandalone()) return '';
  if(installEvt) return (inSheet?'':'')+'<div class="setrow"><div><b>Install EcoLingo</b><span>Open it from your home screen like any app, even offline</span></div><button class="btn sm" data-act="install">Install</button></div>';
  if(isIOS) return '<div class="setrow"><div><b>Add to Home Screen</b><span>In Safari, tap Share, then “Add to Home Screen”</span></div></div>';
  return inSheet ? '' : '<div class="setrow"><div><b>Get the app</b><span>Open this page on your phone and choose “Add to Home Screen” or “Install app”.</span></div></div>';
}
function renderGetApp(){
  var el=$("#getApp"); if(!el) return;
  if(isStandalone()){ el.style.display="none"; return; }
  el.innerHTML='<p class="eyebrow">Get the app</p>'+(installEvt
    ? '<p>Install EcoLingo for one-tap access and offline lessons.</p><button class="btn sm" data-act="install">'+ic("arrow")+'Install EcoLingo</button>'
    : '<p>On your phone, open this page and choose “Add to Home Screen” (iPhone) or “Install app” (Android). It works offline too.</p>');
}
function installApp(){
  if(!installEvt) return;
  installEvt.prompt();
  installEvt.userChoice.then(function(c){ if(c && c.outcome==="accepted"){ toast("Installing EcoLingo…"); } installEvt=null; renderGetApp(); });
}
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); installEvt=e; renderGetApp(); });
window.addEventListener("appinstalled", function(){ installEvt=null; renderGetApp(); toast("EcoLingo installed"); });

/* ---------- first-run welcome ---------- */
function maybeWelcome(){
  if(S.onb) return;
  if(totalPts()>0 || lessonsDone()>0){ S.onb=true; save(); return; }
  if($("#sheet").innerHTML || $("#modal").innerHTML || Q) return;
  var feats=[["learn","#19486A","<b>"+UNITS.length+" short units</b> that grow your SDG plant"],["quiz","#C5192D","<b>"+totalQs()+" quiz questions</b> with instant explanations"],["leaf","#3F7E44","<b>Weekly eco-actions</b> and a live leaderboard"]];
  $("#sheet").innerHTML='<div class="scrim"></div><div class="bsheet welcome" role="dialog" aria-modal="true" aria-labelledby="wel-t">'+
    '<span class="wel-mark">'+ic("sprout")+'</span><h2 id="wel-t">Welcome to EcoLingo</h2>'+
    '<p class="note">Learn the UN Sustainable Development Goals in two-minute lessons and turn them into everyday habits.</p>'+
    '<ul class="wel-list">'+feats.map(function(f){ return '<li><span class="ico" style="background:'+f[1]+'">'+ic(f[0])+'</span><span>'+f[2]+'</span></li>'; }).join("")+'</ul>'+
    '<form id="welForm" class="nick-row"><label class="sr" for="welNick">Nickname</label><input id="welNick" maxlength="16" autocomplete="off" placeholder="Pick a nickname"><button class="btn" type="submit">Let’s go</button></form>'+
    '<p class="fine">Your nickname appears on the leaderboard. You can change it any time.</p></div>';
}
function finishWelcome(){
  var v=($("#welNick").value||"").trim().replace(/\s+/g," ").slice(0,16);
  if(v) S.nick=v;
  S.onb=true; save(); renderHeader(false); closeSheet(); render();
  SFX.play("complete"); SFX.buzz(20);
  toast("Welcome, "+S.nick+"!");
}

/* ---------- boot ---------- */
if(C.on) cloudBoot();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
fillStaticIcons();
renderHeader(false);
var h=(location.hash||"").replace("#","");
go(TABS.indexOf(h)>=0 ? h : "learn");
renderGetApp();
setTimeout(checkBadges, 1200);
setTimeout(maybeWelcome, C.on ? 1500 : 600);
})();
